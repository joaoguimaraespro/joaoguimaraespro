<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="João Guimarães — Tech Lead · Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="128" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="-1">João Guimarães</text>
    <rect x="74" y="152" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="198" font-size="24" font-weight="500" fill="#c9d1d9">Tech Lead · Full-Stack Engineer</text>
    <text x="72" y="232" font-size="17" fill="#8b949e">.NET · Angular · Azure · Healthtech · AI integration</text>
  </g>
</svg>
