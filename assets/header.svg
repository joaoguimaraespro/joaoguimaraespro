<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="João Guimarães — Tech Lead · Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <style>
      .node { fill: #2dd4bf; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .pulse.d2 { animation-delay: 1s; }
      .pulse.d3 { animation-delay: 2s; }
      @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: .9 } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M0 40 H140 L170 70 H330"/>
    <path d="M0 252 H90 L118 224 H260 L285 249 H560"/>
    <path d="M560 0 V30 L590 60 H620"/>
    <path d="M1200 262 H1100 L1080 242 H960"/>
  </g>
  <circle class="node pulse" cx="330" cy="70" r="3.5"/>
  <circle class="node pulse d2" cx="560" cy="249" r="3.5"/>
  <circle class="node pulse d3" cx="620" cy="60" r="3.5"/>
  <circle class="node pulse" cx="960" cy="242" r="3.5"/>

  <!-- name and title -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="54" font-weight="700" fill="#e6edf3" letter-spacing="-1">João Guimarães</text>
    <rect x="66" y="150" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="194" font-size="23" font-weight="500" fill="#c9d1d9">Tech Lead · Full-Stack Engineer</text>
    <text x="64" y="226" font-size="16" fill="#8b949e">.NET · Angular · Azure · Healthtech · AI integration</text>
  </g>

  <!-- code window -->
  <g transform="translate(650 38)">
    <rect width="500" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect width="500" height="30" rx="12" fill="#161b22"/>
    <rect y="18" width="500" height="12" fill="#161b22"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="15" r="5" fill="#febc2e"/>
    <circle cx="56" cy="15" r="5" fill="#28c840"/>
    <text x="250" y="19" text-anchor="middle" class="mono" font-size="11" fill="#6e7681">TechLead.cs</text>
    <g class="mono" xml:space="preserve" style="white-space:pre">
      <text x="20" y="60"><tspan fill="#ff7b72">public class</tspan><tspan fill="#d2a8ff"> TechLead</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#79c0ff">Engineer</tspan></text>
      <text x="20" y="82" fill="#c9d1d9">{</text>
      <text x="44" y="104"><tspan fill="#ff7b72">public</tspan><tspan fill="#79c0ff"> string[]</tspan><tspan fill="#c9d1d9"> Stack =&gt; [</tspan><tspan fill="#a5d6ff">".NET"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Angular"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Azure"</tspan><tspan fill="#c9d1d9">];</tspan></text>
      <text x="44" y="126"><tspan fill="#ff7b72">public</tspan><tspan fill="#79c0ff"> string</tspan><tspan fill="#c9d1d9"> Domain =&gt; </tspan><tspan fill="#a5d6ff">"Healthtech + AI"</tspan><tspan fill="#c9d1d9">;</tspan></text>
      <text x="44" y="148"><tspan fill="#ff7b72">public</tspan><tspan fill="#79c0ff"> Task</tspan><tspan fill="#d2a8ff"> ShipAsync</tspan><tspan fill="#c9d1d9">() =&gt; </tspan><tspan fill="#d2a8ff">Deliver</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ffa657">quality</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">High</tspan><tspan fill="#c9d1d9">);</tspan></text>
      <text x="20" y="170" fill="#c9d1d9">}</text>
      <rect class="cursor" x="32" y="159" width="8" height="15" fill="#2dd4bf"/>
    </g>
  </g>
</svg>
